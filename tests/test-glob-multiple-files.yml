name: Test glob pattern matching multiple files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple test files with tokens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-glob"
          echo "App: #{APP_NAME}#" > "$GITHUB_WORKSPACE/tmp-glob/file1.txt"
          echo "App: #{APP_NAME}#" > "$GITHUB_WORKSPACE/tmp-glob/file2.txt"
          echo "Created files:"
          cat "$GITHUB_WORKSPACE/tmp-glob/file1.txt"
          cat "$GITHUB_WORKSPACE/tmp-glob/file2.txt"

      - name: Run replace-tokens action with glob pattern
        uses: .
        with:
          files: '["${{ github.workspace }}/tmp-glob/*.txt"]'
        env:
          APP_NAME: "MyApp"

      - name: Assert tokens were replaced in all files
        run: |
          CONTENT1=$(cat "$GITHUB_WORKSPACE/tmp-glob/file1.txt")
          CONTENT2=$(cat "$GITHUB_WORKSPACE/tmp-glob/file2.txt")
          echo "file1.txt content: $CONTENT1"
          echo "file2.txt content: $CONTENT2"
          EXPECTED="App: MyApp"
          if [ "$CONTENT1" != "$EXPECTED" ]; then
            echo "FAIL: file1.txt expected '$EXPECTED' but got '$CONTENT1'"
            exit 1
          fi
          if [ "$CONTENT2" != "$EXPECTED" ]; then
            echo "FAIL: file2.txt expected '$EXPECTED' but got '$CONTENT2'"
            exit 1
          fi
          echo "PASS"
