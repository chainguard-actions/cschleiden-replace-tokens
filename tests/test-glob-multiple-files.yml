name: Test glob pattern replacing tokens in multiple files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple files with tokens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-glob"
          echo "App: #{APP_NAME}#" > "$GITHUB_WORKSPACE/tmp-glob/config1.txt"
          echo "Env: #{ENV}#"      > "$GITHUB_WORKSPACE/tmp-glob/config2.txt"
          echo "No tokens here"    > "$GITHUB_WORKSPACE/tmp-glob/config3.txt"

      - id: replace
        uses: .
        with:
          files: '["${{ github.workspace }}/tmp-glob/*.txt"]'
        env:
          APP_NAME: "MyApp"
          ENV: "production"

      - name: Assert tokens replaced in config1.txt
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tmp-glob/config1.txt")
          echo "config1: $CONTENT"
          if [ "$CONTENT" != "App: MyApp" ]; then
            echo "FAIL: expected 'App: MyApp' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS config1"

      - name: Assert tokens replaced in config2.txt
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tmp-glob/config2.txt")
          echo "config2: $CONTENT"
          if [ "$CONTENT" != "Env: production" ]; then
            echo "FAIL: expected 'Env: production' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS config2"

      - name: Assert file without tokens is unchanged
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tmp-glob/config3.txt")
          echo "config3: $CONTENT"
          if [ "$CONTENT" != "No tokens here" ]; then
            echo "FAIL: expected 'No tokens here' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS config3"
