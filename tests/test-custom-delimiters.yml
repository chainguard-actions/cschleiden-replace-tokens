name: Test custom token prefix and suffix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with custom tokens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-custom"
          echo "CDN: __CDN__ and callback: __CALLBACK__" > "$GITHUB_WORKSPACE/tmp-custom/config.txt"
          cat "$GITHUB_WORKSPACE/tmp-custom/config.txt"

      - id: action
        uses: .
        with:
          tokenPrefix: "__"
          tokenSuffix: "__"
          files: '["${{ github.workspace }}/tmp-custom/config.txt"]'
        env:
          CDN: https://cdn.example.com
          CALLBACK: my_callback

      - name: Assert custom tokens were replaced
        run: |
          CONTENT="$(cat "$GITHUB_WORKSPACE/tmp-custom/config.txt")"
          echo "File content: $CONTENT"
          if [ "$CONTENT" != "CDN: https://cdn.example.com and callback: my_callback" ]; then
            echo "FAIL: expected 'CDN: https://cdn.example.com and callback: my_callback' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS"
