name: Test custom token delimiters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create file with custom-delimited tokens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-custom"
          echo "Version: __VERSION__ built by __BUILDER__" > "$GITHUB_WORKSPACE/tmp-custom/version.txt"
          cat "$GITHUB_WORKSPACE/tmp-custom/version.txt"

      - id: replace
        uses: .
        with:
          tokenPrefix: "__"
          tokenSuffix: "__"
          files: '["${{ github.workspace }}/tmp-custom/version.txt"]'
        env:
          VERSION: "1.2.3"
          BUILDER: "CI"

      - name: Assert tokens were replaced with custom delimiters
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tmp-custom/version.txt")
          echo "content: $CONTENT"
          if [ "$CONTENT" != "Version: 1.2.3 built by CI" ]; then
            echo "FAIL: expected 'Version: 1.2.3 built by CI' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS"
