name: Test custom token delimiters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with custom tokens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-custom"
          echo "Version: __VERSION__, Environment: __ENV__" > "$GITHUB_WORKSPACE/tmp-custom/config.txt"
          echo "Created file:"
          cat "$GITHUB_WORKSPACE/tmp-custom/config.txt"

      - name: Run replace-tokens action with custom prefix/suffix
        uses: .
        with:
          tokenPrefix: "__"
          tokenSuffix: "__"
          files: '["${{ github.workspace }}/tmp-custom/config.txt"]'
        env:
          VERSION: "1.2.3"
          ENV: "production"

      - name: Assert custom tokens were replaced
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tmp-custom/config.txt")
          echo "File content after replacement: $CONTENT"
          EXPECTED="Version: 1.2.3, Environment: production"
          if [ "$CONTENT" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS"
